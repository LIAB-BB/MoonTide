<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101326" />
  <meta name="description" content="MoonTide：抽一张牌，看见空间的潮汐。" />
  <title>MoonTide｜月汐</title>
  <style>
    :root { --ink:#f5f0dd; --muted:#aeb4c9; --night:#050914; --panel:#0e1627; --line:#d8b66c30; --moon:#d8ae5d; --tide:#85c9d5; --rose:#c991a7; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 50% -18%,#1f3552 0,transparent 42%),radial-gradient(circle at 6% 58%,#0a2636 0,transparent 34%),var(--night); font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.3; background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#fff 1px,transparent 1px); background-size:91px 91px,149px 149px; background-position:17px 29px,62px 88px; }
    button,input { font:inherit; }
    button { border:0; color:inherit; cursor:pointer; }
    button:focus-visible,input:focus-visible { outline:3px solid var(--tide); outline-offset:3px; }
    .shell { width:min(100%,720px); margin:0 auto; padding:22px 18px 52px; position:relative; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:28px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.05em; }
    .brand-mark { width:35px; height:35px; border-radius:50%; background:radial-gradient(circle at 32% 28%,#fff7c8 0 13%,var(--moon) 14% 53%,#bd8d50 54% 57%,transparent 58%),#2b315d; box-shadow:0 0 24px #f6d77a55; }
    .chips { display:flex; justify-content:flex-end; flex-wrap:wrap; gap:6px; }
    .moon-chip { color:#fbf1c6; font-size:11px; border:1px solid #f6d77a55; border-radius:999px; padding:6px 9px; background:#161a36aa; white-space:nowrap; }
    .hero { padding:8px 2px 21px; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:clamp(36px,9vw,58px); line-height:1.05; letter-spacing:-.05em; }
    .hero p { color:var(--muted); max-width:34rem; margin-top:13px; }
    .section { padding:20px; border:1px solid var(--line); border-radius:24px; background:linear-gradient(155deg,#121c30ed,#080e1aec); box-shadow:0 20px 60px #00050c55; margin-top:15px; }
    .section h2 { font-size:16px; letter-spacing:.04em; margin-bottom:13px; }
    .eyebrow { color:var(--tide); font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; margin-bottom:7px; }
    .choice-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .choice { min-height:100px; padding:14px; text-align:left; border:1px solid var(--line); border-radius:16px; background:#11162e8a; transition:.2s transform,.2s border-color,.2s background; }
    .choice strong { display:block; font-size:16px; }
    .choice span { display:block; margin-top:4px; color:var(--muted); font-size:12px; line-height:1.4; }
    .choice.active { border-color:var(--moon); background:linear-gradient(135deg,#5d4d2555,#1b214099); transform:translateY(-2px); }
    .intent-grid .choice { min-height:78px; }
    .segmented { display:flex; flex-wrap:wrap; gap:8px; }
    .segmented button { padding:9px 12px; border-radius:999px; color:var(--muted); background:#0f142b; border:1px solid var(--line); }
    .segmented button.active { color:#16152a; background:var(--moon); border-color:var(--moon); font-weight:800; }
    .camera { display:grid; grid-template-columns:98px 1fr; gap:13px; align-items:center; min-height:115px; }
    .camera-preview { height:112px; width:98px; overflow:hidden; border-radius:14px; border:1px dashed #ffffff4b; background:#0f142b; display:grid; place-items:center; color:var(--muted); font-size:12px; text-align:center; padding:8px; }
    .camera-preview img { width:100%; height:100%; object-fit:cover; }
    .camera-copy p { color:var(--muted); font-size:13px; margin:4px 0 10px; }
    .file-label { display:inline-flex; align-items:center; justify-content:center; min-height:39px; padding:8px 12px; border-radius:10px; background:#2d3865; font-weight:700; font-size:13px; cursor:pointer; }
    .file-label input { position:absolute; width:1px; height:1px; opacity:0; }
    .privacy { color:#9da4c3; font-size:11px; margin:12px 2px 0; }
    .tide-note { color:#9da4c3; font-size:11px; margin:10px 2px 0; }
    .cta { display:flex; align-items:center; justify-content:center; width:100%; min-height:54px; border-radius:14px; margin-top:18px; color:#181208; font-weight:900; background:linear-gradient(110deg,#e0bb70,var(--moon)); box-shadow:0 10px 28px #d8ae5d2b; }
    .cta:hover { filter:brightness(1.06); }
    .hidden { display:none !important; }
    .ritual { min-height:450px; display:grid; place-items:center; text-align:center; overflow:hidden; }
    .ritual h2 { font-size:28px; margin-top:12px; }
    .ritual p { color:var(--muted); max-width:30ch; margin:8px auto 16px; }
    .deck-scene { height:252px; position:relative; display:grid; place-items:center; width:100%; }
    .deck { position:relative; width:128px; aspect-ratio:300/527; filter:drop-shadow(0 22px 18px #01020ccc); }
    .card-back { position:absolute; inset:0; border-radius:10px; background:#11142d url("photo/Cards-png/卡背.png") center/100% 100% no-repeat; border:1px solid #ffffff36; transition:transform .45s ease; }
    .card-back:nth-child(1) { transform:rotate(-8deg) translate(-8px,3px); } .card-back:nth-child(2) { transform:rotate(7deg) translate(7px,-1px); } .card-back:nth-child(3) { transform:rotate(-2deg); }
    .shuffling .card-back:nth-child(1) { animation:scatter-a 1s ease-in-out infinite; } .shuffling .card-back:nth-child(2) { animation:scatter-b 1s ease-in-out infinite; } .shuffling .card-back:nth-child(3) { animation:scatter-c 1s ease-in-out infinite; }
    @keyframes scatter-a { 50% { transform:rotate(-30deg) translate(-68px,-8px); } } @keyframes scatter-b { 50% { transform:rotate(29deg) translate(65px,8px); } } @keyframes scatter-c { 50% { transform:rotate(12deg) translate(4px,-32px); } }
    .cut-scene { display:flex; justify-content:center; gap:42px; align-items:flex-end; height:250px; }
    .cut-scene .deck { transform:scale(.82); } .cut-scene .deck:last-child { transform:scale(.64) translateY(-18px); }
    .deck-orbit-viewport { height:430px; margin:2px -20px 12px; overflow:hidden; position:relative; touch-action:none; cursor:grab; user-select:none; }
    .deck-orbit-viewport.dragging { cursor:grabbing; }
    .deck-orbit-viewport::before { content:""; position:absolute; width:760px; aspect-ratio:1; left:50%; top:0; transform:translateX(-50%); border:1px solid #d8ae5d63; border-radius:50%; background:radial-gradient(circle,#06101b8c 20%,#07111dc9 57%,#050914 100%),url("photo/Cards-png/卡背32.png") center/cover; box-shadow:inset 0 0 0 12px #050914a8,0 24px 50px #000814b8; pointer-events:none; }
    .deck-orbit-viewport::after { content:"✦  向左或向右拖动牌环  ✦"; position:absolute; z-index:3; left:50%; top:22px; transform:translateX(-50%); color:#f4d998; font-size:11px; font-weight:800; letter-spacing:.1em; white-space:nowrap; pointer-events:none; }
    .deck-orbit { position:absolute; z-index:1; width:760px; aspect-ratio:1; left:50%; top:0; transform:translateX(-50%) rotate(var(--orbit-rotation,0deg)); transition:transform .08s linear; will-change:transform; }
    .orbit-card { position:absolute; left:50%; top:50%; width:48px; aspect-ratio:300/527; padding:0; border:1px solid #e7c575a6; border-radius:5px; background:#11142d url("photo/Cards-png/卡背.png") center/100% 100% no-repeat; box-shadow:0 8px 15px #01030ddd; transform:translate(-50%,-50%) rotate(var(--angle)) translateY(var(--offset)) rotate(var(--counter)); transition:filter .18s,opacity .2s; }
    .orbit-card:hover,.orbit-card:focus-visible { filter:brightness(1.28); }
    .orbit-card.selected { opacity:.12; pointer-events:none; }
    .orbit-status { position:absolute; z-index:3; left:50%; bottom:20px; transform:translateX(-50%); color:#f4d998; font-size:11px; font-weight:800; letter-spacing:.12em; white-space:nowrap; pointer-events:none; }
    .orbit-reveal { min-height:98px; max-width:440px; margin:4px auto 0; padding:12px; display:grid; grid-template-columns:56px 1fr; gap:11px; align-items:center; border-top:1px solid #d8ae5d4b; text-align:left; }
    .orbit-reveal img { width:56px; aspect-ratio:300/527; object-fit:fill; border-radius:5px; box-shadow:0 8px 14px #02030eb3; }
    .orbit-reveal strong { display:block; color:#f4d998; font-size:14px; }
    .orbit-reveal p { max-width:none; margin:4px 0 0; font-size:12px; }
    .action-row { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; }
    .secondary { min-height:44px; padding:10px 15px; background:#2a3159; border:1px solid #ffffff28; border-radius:12px; font-weight:800; }
    .share-toggle { display:flex; align-items:center; justify-content:center; gap:7px; color:var(--muted); font-size:12px; margin:12px 0 4px; }
    .share-toggle input { width:15px; height:15px; accent-color:var(--moon); }
    .result-preview { margin-top:16px; padding:14px; border:1px solid #f6d77a55; border-radius:16px; background:#0f1430cc; }
    .result-preview h3 { margin-bottom:9px; font-size:14px; }
    .result-preview img { display:block; width:min(100%,360px); margin:0 auto; border-radius:12px; box-shadow:0 16px 30px #02030ea8; }
    .result-card { overflow:hidden; padding:0; }
    .result-photo { height:158px; position:relative; background:linear-gradient(#06101a77,#06101acc),url("photo/Cards-png/卡背32.png") center/cover; }
    .result-photo img { width:100%; height:100%; object-fit:cover; opacity:.5; } .result-photo::after { content:""; position:absolute; inset:0; background:linear-gradient(0deg,#171b35,transparent 75%); }
    .result-content { padding:0 20px 21px; margin-top:-43px; position:relative; }
    .badge { display:inline-block; padding:6px 9px; border:1px solid #f6d77a80; border-radius:999px; background:#222646e8; color:#fdf0bf; font-size:12px; font-weight:800; }
    .drawn-cards { display:grid; gap:14px; margin:16px 0; } .drawn-cards.three { grid-template-columns:repeat(3,1fr); gap:8px; }
    .drawn-card { text-align:center; } .drawn-card img { width:100%; max-width:165px; border-radius:9px; box-shadow:0 15px 20px #02030eb3; } .drawn-cards.three .drawn-card img { max-width:100px; }
    .reversed { transform:rotate(180deg); } .card-role { display:block; color:var(--tide); font-size:11px; font-weight:800; margin:9px 0 2px; } .card-name { font-weight:800; font-size:13px; } .card-direction { display:block; color:var(--muted); font-size:11px; }
    .card-meaning { display:block; color:#dfe2f5; font-size:11px; line-height:1.45; margin-top:6px; }
    .verdict { padding:14px; border-left:3px solid var(--moon); border-radius:0 12px 12px 0; background:#0f1430bd; margin:14px 0; }
    .verdict strong { color:#fdf0bf; display:block; font-size:19px; } .verdict p { color:var(--muted); font-size:13px; margin-top:4px; }
    .advice-list { list-style:none; padding:0; margin:13px 0 20px; display:grid; gap:9px; }
    .advice-list li { display:flex; gap:10px; color:#dfe2f5; font-size:14px; } .advice-list li::before { content:"✦"; color:var(--tide); }
    .tiny { color:var(--muted); font-size:11px; text-align:center; margin-top:16px; }
    @media (max-width:420px) { .shell { padding:18px 14px 42px; } .section { padding:16px; border-radius:20px; } .choice-grid { gap:8px; } .choice { min-height:92px; padding:12px; } .deck-orbit-viewport { height:390px; margin-inline:-16px; } .deck-orbit-viewport::before,.deck-orbit { width:700px; } .orbit-card { transform:translate(-50%,-50%) rotate(var(--angle)) translateY(-315px) rotate(var(--counter)); } .drawn-cards.three .drawn-card img { max-width:88px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>MOONTIDE</span></div><div class="chips"><span id="moonChip" class="moon-chip">正在读取月相</span><span id="tideChip" class="moon-chip">旧金山潮位加载中</span></div></header>
    <section id="setupView">
      <div class="hero"><p class="eyebrow">读一读你此刻的空间</p><h1>抽一张牌，<br>看见空间的潮汐。</h1><p>照片只留在你的手机里。月汐用抽牌与空间感受，为你提供一份可执行的当下建议。</p></div>
      <div class="section"><h2>选择这一次的问法</h2><div class="choice-grid" id="modeChoices"><button class="choice active" data-mode="one"><strong>单张 · Yes / No</strong><span>为心里的问题抽一张直觉答案。</span></button><button class="choice" data-mode="three"><strong>三张 · 空间潮汐</strong><span>此刻空间、隐藏阻力、下一步行动。</span></button></div></div>
      <div class="section"><h2>拍下你此刻的环境</h2><div class="camera"><div class="camera-preview" id="cameraPreview">照片只在<br>此设备中使用</div><div class="camera-copy"><strong>给月汐一点空间线索</strong><p>可以拍工位、卧室或你正在停留的地方。</p><label class="file-label">拍照或选择照片<input id="photoInput" type="file" accept="image/*" capture="environment" /></label></div></div><p class="privacy">照片不上传 · 不保存 · 不需要登录，只用于本次结果卡背景。</p><p class="tide-note">旧金山潮位通过 NOAA 公开预测数据读取；不会上传照片或个人信息。</p></div>
      <div class="section"><h2>你希望空间支持什么？</h2><div class="choice-grid intent-grid" id="intentChoices"><button class="choice active" data-intent="专注"><strong>专注</strong><span>让注意力有一个落点。</span></button><button class="choice" data-intent="休息"><strong>休息</strong><span>让身体真正松下来。</span></button><button class="choice" data-intent="连接"><strong>连接</strong><span>让关系与表达更自然。</span></button><button class="choice" data-intent="重启"><strong>重启</strong><span>清出一个新的开始。</span></button></div></div>
      <div class="section"><h2>确认你的空间感受</h2><p class="eyebrow">场景</p><div class="segmented" data-group="scene"><button class="active" data-value="工位">工位</button><button data-value="卧室">卧室</button><button data-value="客厅">客厅</button><button data-value="公共空间">公共空间</button></div><p class="eyebrow" style="margin-top:16px">光感</p><div class="segmented" data-group="light"><button class="active" data-value="明亮">明亮</button><button data-value="昏暗">昏暗</button><button data-value="人工光">人工光为主</button></div><p class="eyebrow" style="margin-top:16px">状态</p><div class="segmented" data-group="tidy"><button class="active" data-value="一般">一般</button><button data-value="整洁">整洁</button><button data-value="杂乱">杂乱</button></div></div>
      <button id="beginButton" class="cta">开始这一场月汐</button>
    </section>
    <section id="ritualView" class="section ritual hidden" aria-live="polite"></section>
    <section id="resultView" class="section result-card hidden"></section>
  </main>
  <script src="tarot-content.js"></script>
  <script>
    const majorCards = [
      ["00-TheFool.png","愚者"],["01-TheMagician.png","魔术师"],["02-TheHighPriestess.png","女祭司"],["03-TheEmpress.png","皇后"],["04-TheEmperor.png","皇帝"],["05-TheHierophant.png","教皇"],["06-TheLovers.png","恋人"],["07-TheChariot.png","战车"],["08-Strength.png","力量"],["09-TheHermit.png","隐者"],["10-WheelOfFortune.png","命运之轮"],["11-Justice.png","正义"],["12-TheHangedMan.png","倒吊人"],["13-Death.png","死神"],["14-Temperance.png","节制"],["15-TheDevil.png","恶魔"],["16-TheTower.png","高塔"],["17-TheStar.png","星星"],["18-TheMoon.png","月亮"],["19-TheSun.png","太阳"],["20-Judgement.png","审判"],["21-TheWorld.png","世界"]
    ].map(([file,name],index)=>({id:`major-${index}`,name,file:`photo/Cards-png/${file}`,suit:"大阿尔卡那",rank:index}));
    const ranks = ["王牌","二","三","四","五","六","七","八","九","十","侍从","骑士","王后","国王"];
    const suits = [["Cups","圣杯"],["Wands","权杖"],["Swords","宝剑"],["Pentacles","星币"]];
    const cards = [...majorCards, ...suits.flatMap(([fileSuit,suit]) => ranks.map((rank,index) => ({id:`${fileSuit}-${index+1}`,name:`${suit}${rank}`,file:`photo/Cards-png/${fileSuit}${String(index+1).padStart(2,"0")}.png`,suit,rank:index+1})) )];
    const tarotContent = window.MOONTIDE_TAROT_CONTENT;
    const state = { mode:"one", intent:"专注", scene:"工位", light:"明亮", tidy:"一般", photoUrl:"", deck:[], drawn:[], orientations:[], orbitRotation:0, suppressOrbitClick:false, resultImageUrl:"", tide:null };
    const setupView = document.querySelector("#setupView"), ritualView = document.querySelector("#ritualView"), resultView = document.querySelector("#resultView");
    const secureRandom = max => { const limit=Math.floor(0x100000000/max)*max; let value; do { value=crypto.getRandomValues(new Uint32Array(1))[0]; } while(value>=limit); return value%max; };
    const shuffle = source => { const copy=[...source]; for(let i=copy.length-1;i>0;i--){const j=secureRandom(i+1); [copy[i],copy[j]]=[copy[j],copy[i]];} return copy; };
    const moonInfo = () => { const cycle=29.53058867, knownNew=Date.UTC(2000,0,6,18,14), now=Date.now(); let age=((now-knownNew)/86400000)%cycle; if(age<0)age+=cycle; const fraction=age/cycle, names=["新月","娥眉月","上弦月","盈凸月","满月","亏凸月","下弦月","残月"]; const index=Math.round(48+34*Math.sin(fraction*Math.PI*2-.9)+12*Math.sin(fraction*Math.PI*4)); return {name:names[Math.round(fraction*8)%8], index:Math.max(0,Math.min(100,index))}; };
    const moon = moonInfo();
    const pacificDate = offset => { const parts=new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date(Date.now()+offset)); const get=type=>parts.find(part=>part.type===type).value; return `${get("year")}${get("month")}${get("day")}`; };
    const sfTime = at => new Intl.DateTimeFormat("zh-CN",{timeZone:"America/Los_Angeles",hour:"2-digit",minute:"2-digit",hour12:false}).format(at);
    const loadSFTide = async () => {
      const chip=document.querySelector("#tideChip");
      try {
        const url=`https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?begin_date=${pacificDate(0)}&end_date=${pacificDate(86400000)}&station=9414290&product=predictions&datum=MLLW&time_zone=gmt&units=metric&interval=hilo&application=MoonTide&format=json`;
        const response=await fetch(url,{cache:"no-store"});
        if(!response.ok) throw new Error("潮位服务暂不可用");
        const payload=await response.json();
        const events=(payload.predictions||[]).map(item=>({type:item.type, height:Number(item.v), at:new Date(`${item.t.replace(" ","T")}Z`).getTime()})).filter(item=>Number.isFinite(item.at));
        const next=events.find(item=>item.at>Date.now());
        if(!next) throw new Error("未找到下一次潮位");
        state.tide={next, motion:next.type==="H"?"涨潮中":"落潮中"};
        chip.textContent=`旧金山${state.tide.motion} · ${sfTime(next.at)}`;
      } catch (_) { state.tide={unavailable:true}; chip.textContent="旧金山潮位暂不可用"; }
    };
    document.querySelector("#moonChip").textContent=`${moon.name} · 月相 ${moon.index}%`;
    document.querySelectorAll("#modeChoices button").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll("#modeChoices button").forEach(b=>b.classList.remove("active"));button.classList.add("active");state.mode=button.dataset.mode;}));
    document.querySelectorAll("#intentChoices button").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll("#intentChoices button").forEach(b=>b.classList.remove("active"));button.classList.add("active");state.intent=button.dataset.intent;}));
    document.querySelectorAll("[data-group]").forEach(group=>group.querySelectorAll("button").forEach(button=>button.addEventListener("click",()=>{group.querySelectorAll("button").forEach(b=>b.classList.remove("active"));button.classList.add("active");state[group.dataset.group]=button.dataset.value;})));
    document.querySelector("#photoInput").addEventListener("change",event=>{const file=event.target.files?.[0];if(!file)return;if(state.photoUrl)URL.revokeObjectURL(state.photoUrl);state.photoUrl=URL.createObjectURL(file);document.querySelector("#cameraPreview").innerHTML=`<img alt="你的环境照片预览" src="${state.photoUrl}">`;});
    const intentNudge = {"专注":"把它放在最少干扰的地方完成。","休息":"以不透支自己为标准。","连接":"让它成为可以被看见和回应的动作。","重启":"完成后不要立刻加新任务，先感受空出来的位置。"};
    const readingFor = card => {
      const direction=card.reversed?"rev":"up";
      const base=tarotContent.major[card.id] ? tarotContent.major[card.id][direction] : (()=>{const rank=tarotContent.ranks[card.rank][direction], suit=tarotContent.suits[card.suit][direction]; return {keyword:`${rank.keyword} · ${suit.title}`,signal:`${rank.signal}${suit.signal}`,action:`${rank.action}${suit.action}`,decision:rank.decision};})();
      return {...base, action:`${base.action}${intentNudge[state.intent]}`};
    };
    const brief = text => text.match(/^.*?[。！？]/)?.[0] || text;
    const positionCopy = (card,role) => { const reading=readingFor(card); if(role==="隐藏阻力") return `阻力 · ${brief(reading.signal)}`; if(role==="下一步行动") return `行动 · ${brief(reading.action)}`; return `提示 · ${brief(reading.signal)}`; };
    const getAdvice = () => { const actionCard=state.mode==="three"?state.drawn[2]:state.drawn[0], scene={"工位":"桌上只留今天要用的三样工具。","卧室":"移走一件会让你继续工作的东西。","客厅":"给座位旁留一个可停留的空位。","公共空间":"整理出一平方米的轻松角落。"}[state.scene], context=state.tidy==="杂乱"?"先清掉动线上的三样东西。":state.light==="昏暗"?"补一盏只照任务的暖光。":state.light==="人工光"?"把刺眼光源移出直视范围。":"把最舒服的一束光留给当下。"; return [brief(readingFor(actionCard).action),scene,context]; };
    const verdict = () => { const first=state.drawn[0]; if(state.mode==="one"){const reading=readingFor(first);return {title:reading.decision,copy:`${first.name}${first.reversed?"逆位":"正位"} · ${reading.keyword}`};} const [present,obstacle,action]=state.drawn.map(readingFor); return {title:`主线 · ${present.keyword}`,copy:`先面对「${obstacle.keyword}」，再做「${action.keyword}」的第一步。`}; };
    const tideSummary = () => state.tide?.next ? `旧金山${state.tide.motion} · 下次${state.tide.next.type==="H"?"高潮":"低潮"} ${sfTime(state.tide.next.at)}` : "旧金山潮位暂不可用";
    const renderRitual = step => {
      setupView.classList.add("hidden"); resultView.classList.add("hidden"); ritualView.classList.remove("hidden");
      if(step==="shuffle") ritualView.innerHTML=`<div><div class="deck-scene"><div class="deck shuffling"><span class="card-back"></span><span class="card-back"></span><span class="card-back"></span></div></div><p class="eyebrow">让问题安静下来</p><h2>洗牌中</h2><p>闭上眼，想象你希望空间支持你的「${state.intent}」。</p><button class="cta" id="toCut">我准备好了</button></div>`;
      if(step==="cut") ritualView.innerHTML=`<div><div class="cut-scene"><div class="deck"><span class="card-back"></span><span class="card-back"></span><span class="card-back"></span></div><div class="deck"><span class="card-back"></span><span class="card-back"></span><span class="card-back"></span></div></div><p class="eyebrow">跟随第一直觉</p><h2>切一切牌</h2><p>牌序已经确定；转动牌环后，任选你最想靠近的牌。</p><button class="cta" id="toDraw">完成切牌</button></div>`;
      if(step==="draw") { const labels=state.mode==="one"?["你的答案"]:["此刻空间","隐藏阻力","下一步行动"], desired=labels.length, selected=new Set(state.drawn.map(card=>card.deckIndex)), orbitCards=state.deck.map((card,index)=>{const angle=index*(360/state.deck.length);return `<button class="orbit-card ${selected.has(index)?"selected":""}" data-ring-card="${index}" style="--angle:${angle}deg;--counter:${-angle}deg;--offset:-342px;z-index:${index}" aria-label="抽取一张牌"></button>`;}).join(""), last=state.drawn.at(-1), lastRole=last?labels[state.drawn.length-1]:"", reveal=last?`<img class="${last.reversed?"reversed":""}" src="${last.file}" alt="${last.name}${last.reversed?"逆位":"正位"}"><div><strong>${lastRole} · ${last.name}${last.reversed?"逆位":"正位"}</strong><p>${positionCopy(last,lastRole)}</p></div>`:`<div></div><div><strong>拖动整副牌环</strong><p>松手后，轻点你想抽出的任意一张。</p></div>`; ritualView.innerHTML=`<div><p class="eyebrow">78 张牌已经洗好</p><h2>${state.mode==="one"?"让一张牌停在指尖":"拖动牌环，抽出三张"}</h2><p id="drawHint">${state.drawn.length?`已抽 ${state.drawn.length} 张，还差 ${desired-state.drawn.length} 张。`:"这是一整圈牌；屏幕只露出其中一段。"}</p><div id="deckViewport" class="deck-orbit-viewport"><div id="deckOrbit" class="deck-orbit" style="--orbit-rotation:${state.orbitRotation}deg">${orbitCards}</div><span class="orbit-status">已抽 ${state.drawn.length} / ${desired}</span></div><div id="orbitReveal" class="orbit-reveal" aria-live="polite">${reveal}</div><button class="cta ${state.drawn.length===desired?"":"hidden"}" id="toResult">查看完整解读</button></div>`; document.querySelectorAll("[data-ring-card]").forEach(button=>button.addEventListener("click",()=>drawOrbitCard(Number(button.dataset.ringCard),labels))); setupOrbitDrag(); document.querySelector("#toResult")?.addEventListener("click",renderResult); }
      document.querySelector("#toCut")?.addEventListener("click",()=>renderRitual("cut")); document.querySelector("#toDraw")?.addEventListener("click",()=>renderRitual("draw"));
    };
    const setupOrbitDrag = () => { const viewport=document.querySelector("#deckViewport"); let pointerId=null,startX=0,startRotation=state.orbitRotation,moved=false; viewport.addEventListener("pointerdown",event=>{if(event.pointerType==="mouse"&&event.button!==0)return;pointerId=event.pointerId;startX=event.clientX;startRotation=state.orbitRotation;moved=false;viewport.setPointerCapture?.(pointerId);viewport.classList.add("dragging");}); viewport.addEventListener("pointermove",event=>{if(event.pointerId!==pointerId)return;const delta=event.clientX-startX;if(Math.abs(delta)>5)moved=true;state.orbitRotation=startRotation+delta*.24;document.querySelector("#deckOrbit")?.style.setProperty("--orbit-rotation",`${state.orbitRotation}deg`);}); const release=event=>{if(event.pointerId!==pointerId)return;viewport.releasePointerCapture?.(pointerId);viewport.classList.remove("dragging");pointerId=null;if(moved){state.suppressOrbitClick=true;window.setTimeout(()=>state.suppressOrbitClick=false,0);}};viewport.addEventListener("pointerup",release);viewport.addEventListener("pointercancel",release); };
    const drawOrbitCard = (index,roles) => { if(state.suppressOrbitClick||state.drawn.length>=roles.length||state.drawn.some(card=>card.deckIndex===index)) return; const card={...state.deck[index],deckIndex:index,reversed:state.orientations[index]}; state.drawn.push(card); renderRitual("draw"); };
    const begin = () => { state.deck=shuffle(cards); state.orientations=state.deck.map(()=>secureRandom(2)===1); state.drawn=[]; state.orbitRotation=secureRandom(360); state.suppressOrbitClick=false; renderRitual("shuffle"); };
    const renderResult = () => { ritualView.classList.add("hidden"); resultView.classList.remove("hidden"); const roles=state.mode==="one"?["你的答案"]:["此刻空间","隐藏阻力","下一步行动"], v=verdict(), advice=getAdvice(); resultView.innerHTML=`<div class="result-photo">${state.photoUrl?`<img src="${state.photoUrl}" alt="本次环境照片">`:""}</div><div class="result-content"><span class="badge">${moon.name} · 月相 ${moon.index}% · ${tideSummary()}</span><h2 style="font-size:28px;margin-top:12px">你的空间正在对你说</h2><p class="eyebrow" style="margin-top:6px">本次意图 · ${state.intent}</p><div class="drawn-cards ${state.mode}">${state.drawn.map((card,index)=>{const reading=readingFor(card);return `<article class="drawn-card"><img class="${card.reversed?"reversed":""}" src="${card.file}" alt="${card.name}${card.reversed?"逆位":"正位"}"><span class="card-role">${roles[index]}</span><span class="card-name">${card.name}</span><span class="card-direction">${card.reversed?"逆位":"正位"} · ${reading.keyword}</span><span class="card-meaning">${positionCopy(card,roles[index])}</span></article>`;}).join("")}</div><div class="verdict"><strong>${v.title}</strong><p>${v.copy}</p></div><h3>给 ${state.scene} 的三步行动</h3><ul class="advice-list">${advice.map(item=>`<li>${item}</li>`).join("")}</ul><label class="share-toggle"><input type="checkbox" id="includePhoto">结果图包含环境照片（默认关闭）</label><div class="action-row"><button class="secondary" id="shareButton">生成结果预览</button><button class="secondary" id="againButton">再读一次</button></div><div id="resultPreview" class="result-preview hidden"></div><p class="tiny">照片未上传、未保存。潮位来自 NOAA 旧金山公开预测；月汐结果用于娱乐与空间灵感，不构成健康、财务或命运判断。</p></div>`; document.querySelector("#againButton").addEventListener("click",()=>{if(state.resultImageUrl)URL.revokeObjectURL(state.resultImageUrl);state.resultImageUrl="";resultView.classList.add("hidden");setupView.classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"});}); document.querySelector("#shareButton").addEventListener("click",previewResultImage); };
    const loadImage = src => new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=src;});
    const drawCover = (ctx,image,x,y,width,height,alpha=1) => { const scale=Math.max(width/image.width,height/image.height), sourceWidth=width/scale, sourceHeight=height/scale, sourceX=(image.width-sourceWidth)/2, sourceY=(image.height-sourceHeight)/2; ctx.save();ctx.globalAlpha=alpha;ctx.drawImage(image,sourceX,sourceY,sourceWidth,sourceHeight,x,y,width,height);ctx.restore(); };
    const wrapText = (ctx,text,x,y,maxWidth,lineHeight,maxLines=6) => { const chars=[...text];let line="",lines=[];chars.forEach(char=>{const trial=line+char;if(ctx.measureText(trial).width>maxWidth&&line){lines.push(line);line=char;}else line=trial;});if(line)lines.push(line);lines.slice(0,maxLines).forEach((item,index)=>ctx.fillText(item,x,y+lineHeight*index));return y+lineHeight*Math.min(lines.length,maxLines); };
    const previewResultImage = async () => { const button=document.querySelector("#shareButton"); button.disabled=true;button.textContent="正在生成…"; try { const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d"),width=1080,height=1600;canvas.width=width;canvas.height=height; const background=ctx.createLinearGradient(0,0,width,height);background.addColorStop(0,"#202b58");background.addColorStop(.52,"#111a38");background.addColorStop(1,"#070b1e");ctx.fillStyle=background;ctx.fillRect(0,0,width,height); if(document.querySelector("#includePhoto").checked&&state.photoUrl){try{drawCover(ctx,await loadImage(state.photoUrl),0,0,width,490,.28);}catch(_){}} ctx.fillStyle="#f6d77a";ctx.font="700 34px -apple-system, PingFang SC, sans-serif";ctx.fillText("MOONTIDE · 月汐",72,100);ctx.fillStyle="#d4defe";ctx.font="28px -apple-system, PingFang SC, sans-serif";ctx.fillText(`${moon.name} · ${tideSummary()}`,72,150); const cardWidth=state.mode==="one"?270:200,cardHeight=Math.round(cardWidth*527/300),gap=state.mode==="one"?0:40,startX=(width-(cardWidth*state.drawn.length+gap*(state.drawn.length-1)))/2,summaryY=state.mode==="one"?920:800; for(let index=0;index<state.drawn.length;index++){const card=state.drawn[index],image=await loadImage(card.file),x=startX+index*(cardWidth+gap),y=230;ctx.save();if(card.reversed){ctx.translate(x+cardWidth/2,y+cardHeight/2);ctx.rotate(Math.PI);drawCover(ctx,image,-cardWidth/2,-cardHeight/2,cardWidth,cardHeight);}else drawCover(ctx,image,x,y,cardWidth,cardHeight);ctx.restore();ctx.fillStyle="#8fdce7";ctx.font="700 22px -apple-system, PingFang SC, sans-serif";ctx.textAlign="center";ctx.fillText(state.mode==="one"?"你的答案":["此刻空间","隐藏阻力","下一步行动"][index],x+cardWidth/2,y+cardHeight+38);ctx.fillStyle="#f7f0d0";ctx.font="700 24px -apple-system, PingFang SC, sans-serif";ctx.fillText(`${card.name}${card.reversed?" · 逆位":" · 正位"}`,x+cardWidth/2,y+cardHeight+72);} ctx.textAlign="left";const v=verdict();ctx.fillStyle="#f6d77a";ctx.font="700 44px -apple-system, PingFang SC, sans-serif";ctx.fillText(v.title,72,summaryY);ctx.fillStyle="#e9edff";ctx.font="29px -apple-system, PingFang SC, sans-serif";const summaryEnd=wrapText(ctx,v.copy,72,summaryY+55,936,45,3);ctx.fillStyle="#8fdce7";ctx.font="700 25px -apple-system, PingFang SC, sans-serif";ctx.fillText(`给「${state.intent}」的一个行动`,72,summaryEnd+80);ctx.fillStyle="#f6f7ff";ctx.font="30px -apple-system, PingFang SC, sans-serif";wrapText(ctx,getAdvice()[0],72,summaryEnd+130,936,48,3);ctx.fillStyle="#9da9d0";ctx.font="23px -apple-system, PingFang SC, sans-serif";ctx.fillText("照片仅在你勾选时加入此图 · MoonTide",72,1515);const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));if(!blob) throw new Error("无法生成图片");if(state.resultImageUrl)URL.revokeObjectURL(state.resultImageUrl);state.resultImageUrl=URL.createObjectURL(blob);const preview=document.querySelector("#resultPreview");preview.innerHTML=`<h3>结果图预览</h3><img src="${state.resultImageUrl}" alt="MoonTide 结果图预览"><div class="action-row" style="margin-top:12px"><button class="secondary" id="saveResultButton">保存图片</button></div>`;preview.classList.remove("hidden");document.querySelector("#saveResultButton").addEventListener("click",saveResultImage);preview.scrollIntoView({behavior:"smooth",block:"center"});}catch(_){alert("结果图生成失败，请截屏保存本次结果。");}finally{button.disabled=false;button.textContent="生成结果预览";}};
    const saveResultImage = () => { if(!state.resultImageUrl) return; const link=document.createElement("a");link.href=state.resultImageUrl;link.download="moontide-result.png";link.click(); };
    document.querySelector("#beginButton").addEventListener("click",begin);
    loadSFTide();
  </script>
